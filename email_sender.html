<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投稿邮箱</title>
  <style>
    :root {
      --brand: #c5242c;
      --brand-dark: #9f1720;
      --brand-soft: #fff1f2;
      --line: #e6e8eb;
      --muted: #69707a;
      --text: #24272b;
      --sidebar: #f7f8fa;
      --success: #18794e;
      --warning: #a35b00;
      --danger: #b42318;
      --shadow: 0 16px 48px rgba(35, 38, 45, .16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: #eef0f3;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: 64px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
      background: linear-gradient(110deg, var(--brand-dark), var(--brand));
      box-shadow: 0 2px 10px rgba(91, 9, 15, .22);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 9px;
      background: rgba(255, 255, 255, .12);
      font-size: 19px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand-subtitle {
      margin-top: 1px;
      color: rgba(255, 255, 255, .72);
      font-size: 11px;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, .88);
    }

    .account button {
      padding: 7px 11px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      background: transparent;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
    }

    .sidebar {
      padding: 20px 14px;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }

    .compose-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      color: #fff;
      border: 0;
      border-radius: 7px;
      background: var(--brand);
      box-shadow: 0 5px 14px rgba(197, 36, 44, .22);
      font-weight: 700;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      margin-top: 18px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      color: #4c535b;
      border: 0;
      border-radius: 6px;
      background: transparent;
      text-align: left;
    }

    .nav-item.active {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 700;
    }

    .main {
      min-width: 0;
      padding: 24px;
    }

    .composer {
      max-width: 1080px;
      min-height: calc(100vh - 112px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(35, 38, 45, .07);
    }

    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfc;
    }

    .composer-title {
      font-size: 17px;
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a4a8ae;
    }

    .connection.ready .connection-dot {
      background: #2eaa69;
      box-shadow: 0 0 0 3px rgba(46, 170, 105, .13);
    }

    .connection.warning .connection-dot {
      background: #e49a23;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }

    .send-button {
      min-width: 88px;
      padding: 9px 18px;
      color: #fff;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      font-weight: 700;
    }

    .send-button:hover {
      background: var(--brand-dark);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .secondary-button {
      padding: 8px 14px;
      color: #4b5158;
      border: 1px solid #d4d7db;
      border-radius: 6px;
      background: #fff;
    }

    .danger-button {
      color: #b42318;
      border-color: #f0b8b3;
    }

    .form-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      align-items: center;
      min-height: 50px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .form-row label {
      color: #555c64;
    }

    .form-row input {
      min-width: 0;
      padding: 11px 4px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }

    .form-row input::placeholder,
    textarea::placeholder {
      color: #a0a5ab;
    }

    .attachment-row {
      align-items: start;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .attachment-control {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
    }

    .attachment-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      color: #4b5158;
      border: 1px solid #d4d7db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .attachment-label input {
      display: none;
    }

    .attachment-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .file-list {
      width: 100%;
      display: grid;
      gap: 5px;
      margin-top: 5px;
      color: #555c64;
      font-size: 12px;
    }

    .body-wrap {
      padding: 18px 20px 0;
    }

    .body-label {
      margin-bottom: 9px;
      color: #555c64;
    }

    textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #dfe2e6;
      border-radius: 7px;
      outline: none;
      color: #202328;
      background: #fff;
      line-height: 1.75;
    }

    textarea:focus,
    .form-row:focus-within {
      border-color: #d7a1a4;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 20px;
    }

    .tracking-option {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #41474e;
    }

    .tracking-option input {
      width: 17px;
      height: 17px;
      accent-color: var(--brand);
    }

    .tracking-help {
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      display: none;
      margin: 0 20px 18px;
      padding: 11px 13px;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: var(--success);
      background: #ebf8f1;
    }

    .message.warning {
      color: var(--warning);
      background: #fff6e5;
    }

    .message.error {
      color: var(--danger);
      background: #fff0ef;
    }

    .hidden {
      display: none !important;
    }

    .sent-content {
      padding: 20px;
    }

    .sent-note {
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 12px;
    }

    .sent-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .sent-table {
      width: 100%;
      min-width: 760px;
      border-collapse: collapse;
    }

    .sent-table th,
    .sent-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    .sent-table th {
      color: var(--muted);
      background: #f7f8fa;
      font-size: 12px;
      font-weight: 600;
    }

    .sent-table tr:last-child td {
      border-bottom: 0;
    }

    .tracking-code {
      color: #555c64;
      font: 12px/1.4 Consolas, monospace;
    }

    .sent-status {
      color: var(--muted);
      white-space: nowrap;
    }

    .sent-status.opened {
      color: var(--success);
      font-weight: 700;
    }

    .sent-status.pending {
      color: var(--warning);
    }

    .sent-empty {
      padding: 48px 20px;
      color: var(--muted);
      text-align: center;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(28, 31, 37, .62);
      backdrop-filter: blur(4px);
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 28px;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .auth-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      color: #fff;
      border-radius: 10px;
      background: var(--brand);
      font-size: 21px;
    }

    .auth-card h1 {
      margin: 0;
      font-size: 21px;
    }

    .auth-card p {
      margin: 8px 0 18px;
      color: var(--muted);
    }

    .auth-card input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d7dade;
      border-radius: 7px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(197, 36, 44, .1);
    }

    .auth-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .auth-error {
      min-height: 20px;
      margin-top: 9px;
      color: var(--danger);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .main {
        padding: 12px;
      }

      .composer {
        min-height: calc(100vh - 88px);
      }

      .account span {
        display: none;
      }

      .form-row {
        grid-template-columns: 72px minmax(0, 1fr);
        padding: 0 14px;
      }

      .body-wrap,
      .toolbar,
      .options {
        padding-right: 14px;
        padding-left: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">✉</div>
        <div>
          <div class="brand-title">投稿邮箱</div>
          <div class="brand-subtitle">普通正文 · 附件 · 打开跟踪</div>
        </div>
      </div>
      <div class="account">
        <span id="accountLabel">尚未连接 SMTP</span>
        <button id="logoutButton" type="button">退出</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <button id="composeButton" class="compose-nav" type="button">✎ 写信</button>
        <nav class="nav-list" aria-label="邮箱导航">
          <button id="composeNav" class="nav-item active" type="button">▣ 正在写信</button>
          <button id="sentNav" class="nav-item" type="button">□ 已发送</button>
        </nav>
      </aside>

      <main class="main">
        <form id="emailForm" class="composer">
          <div class="composer-header">
            <div class="composer-title">写投稿邮件</div>
            <div id="connectionStatus" class="connection">
              <span class="connection-dot"></span>
              <span id="connectionText">正在检查发信配置</span>
            </div>
          </div>

          <div class="toolbar">
            <button id="sendButton" class="send-button" type="submit">发送</button>
            <button id="clearButton" class="secondary-button" type="button">清空</button>
            <button id="sentToolbarButton" class="secondary-button" type="button">已发送</button>
          </div>

          <div class="form-row">
            <label for="recipientLabel">投稿对象</label>
            <input id="recipientLabel" name="recipient_label" type="text" maxlength="60" required placeholder="例如：钟山、收获">
          </div>

          <div class="form-row">
            <label for="recipient">收件人</label>
            <input id="recipient" name="recipient" type="email" required placeholder="name@example.com" autocomplete="off">
          </div>

          <div class="form-row">
            <label for="subject">主题</label>
            <input id="subject" name="subject" type="text" maxlength="200" required placeholder="请输入邮件主题">
          </div>

          <div class="form-row attachment-row">
            <label>附件</label>
            <div class="attachment-control">
              <label class="attachment-label">
                <span>＋ 添加附件</span>
                <input id="attachments" name="attachments" type="file" multiple>
              </label>
              <span class="attachment-hint">最多 5 个，合计不超过 20 MB</span>
              <div id="fileList" class="file-list"></div>
            </div>
          </div>

          <div class="body-wrap">
            <div class="body-label">正文</div>
            <textarea id="body" name="body" required placeholder="这里直接粘贴或输入普通 TXT 正文，不需要写 HTML。"></textarea>
          </div>

          <div class="options">
            <label class="tracking-option">
              <input id="trackingEnabled" name="tracking_enabled" type="checkbox" checked>
              <span>启用打开跟踪</span>
            </label>
            <span class="tracking-help">后台会自动在正文末尾加入透明的 1×1 图片。</span>
          </div>

          <div id="message" class="message" role="status"></div>
        </form>

        <section id="sentView" class="composer hidden" aria-label="已发送邮件">
          <div class="composer-header">
            <div class="composer-title">已发送</div>
            <div class="connection">
              <span>最多显示最近 100 封</span>
            </div>
          </div>
          <div class="toolbar">
            <button id="backComposeButton" class="secondary-button" type="button">写信</button>
            <button id="refreshSentButton" class="secondary-button" type="button">刷新列表</button>
            <button id="clearSentButton" class="secondary-button danger-button" type="button">清空记录</button>
          </div>
          <div class="sent-content">
            <div class="sent-note">打开状态不会自动查询。需要时点击对应邮件右侧的“查询”，即使一个月后也可以。</div>
            <div id="sentTableWrap" class="sent-table-wrap hidden">
              <table class="sent-table">
                <thead>
                  <tr>
                    <th>发送时间</th>
                    <th>投稿对象</th>
                    <th>收件邮箱</th>
                    <th>邮件名称</th>
                    <th>跟踪编号</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="sentTableBody"></tbody>
              </table>
            </div>
            <div id="sentEmpty" class="sent-empty">点击“已发送”读取发送记录。</div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <div id="authOverlay" class="auth-overlay">
    <form id="authForm" class="auth-card">
      <div class="auth-icon">✉</div>
      <h1>进入投稿邮箱</h1>
      <p>输入风水大师后台现有的管理密码。密码只保存在本次浏览器会话中。</p>
      <input id="adminPassword" type="password" required autocomplete="current-password" placeholder="管理密码">
      <div id="authError" class="auth-error"></div>
      <div class="auth-actions">
        <button class="send-button" type="submit">进入写信</button>
      </div>
    </form>
  </div>

  <script>
    const emailForm = document.getElementById('emailForm');
    const authForm = document.getElementById('authForm');
    const authOverlay = document.getElementById('authOverlay');
    const authError = document.getElementById('authError');
    const adminPassword = document.getElementById('adminPassword');
    const connectionStatus = document.getElementById('connectionStatus');
    const connectionText = document.getElementById('connectionText');
    const accountLabel = document.getElementById('accountLabel');
    const sendButton = document.getElementById('sendButton');
    const clearButton = document.getElementById('clearButton');
    const sentToolbarButton = document.getElementById('sentToolbarButton');
    const backComposeButton = document.getElementById('backComposeButton');
    const logoutButton = document.getElementById('logoutButton');
    const attachments = document.getElementById('attachments');
    const fileList = document.getElementById('fileList');
    const message = document.getElementById('message');
    const trackingEnabled = document.getElementById('trackingEnabled');
    const composeButton = document.getElementById('composeButton');
    const composeNav = document.getElementById('composeNav');
    const sentNav = document.getElementById('sentNav');
    const sentView = document.getElementById('sentView');
    const refreshSentButton = document.getElementById('refreshSentButton');
    const clearSentButton = document.getElementById('clearSentButton');
    const sentTableWrap = document.getElementById('sentTableWrap');
    const sentTableBody = document.getElementById('sentTableBody');
    const sentEmpty = document.getElementById('sentEmpty');

    let sessionPassword = sessionStorage.getItem('emailAdminPassword') || '';
    let smtpConfigured = false;
    const trackingStatusCacheKey = 'emailTrackingStatusV1';

    function readTrackingStatusCache() {
      try {
        return JSON.parse(localStorage.getItem(trackingStatusCacheKey) || '{}');
      } catch {
        return {};
      }
    }

    function saveTrackingStatus(trackingId, status) {
      const cache = readTrackingStatusCache();
      cache[trackingId] = status;
      localStorage.setItem(trackingStatusCacheKey, JSON.stringify(cache));
    }

    function applyTrackingStatus(data, statusCell) {
      if (data.tracking_state === 'possible_human' || data.opened) {
        statusCell.textContent = data.last_opened_at
          ? `已打开 · ${data.last_opened_at}`
          : '已打开';
        statusCell.className = 'sent-status opened';
      } else if (data.tracking_state === 'mail_system_loaded' || data.suspected_automated_count > 0) {
        statusCell.textContent = data.last_suspected_at
          ? `邮箱系统已加载 · ${data.last_suspected_at}`
          : '邮箱系统已加载';
        statusCell.className = 'sent-status opened';
      } else {
        statusCell.textContent = '暂未检测到图片加载';
        statusCell.className = 'sent-status pending';
      }
    }

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function hideMessage() {
      message.textContent = '';
      message.className = 'message';
    }

    function setConnection(state, text) {
      connectionStatus.className = `connection ${state || ''}`;
      connectionText.textContent = text;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function renderFiles() {
      fileList.replaceChildren();
      Array.from(attachments.files).forEach(file => {
        const row = document.createElement('div');
        row.textContent = `${file.name} · ${formatBytes(file.size)}`;
        fileList.appendChild(row);
      });
    }

    function showComposeView() {
      emailForm.classList.remove('hidden');
      sentView.classList.add('hidden');
      composeNav.classList.add('active');
      sentNav.classList.remove('active');
    }

    async function querySentTracking(item, statusCell, button) {
      if (!item.tracking_enabled || !item.tracking_id) return;

      button.disabled = true;
      button.textContent = '查询中…';
      statusCell.textContent = '正在查询';
      statusCell.className = 'sent-status';

      try {
        const response = await fetch(`/api/email/tracking/${encodeURIComponent(item.tracking_id)}`, {
          headers: { Authorization: sessionPassword }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || '查询失败');
        }

        saveTrackingStatus(item.tracking_id, data);
        applyTrackingStatus(data, statusCell);
      } catch (error) {
        statusCell.textContent = error.message;
        statusCell.className = 'sent-status pending';
      } finally {
        button.disabled = false;
        button.textContent = '重新查询';
      }
    }

    function renderSentEmails(items) {
      sentTableBody.replaceChildren();
      const trackingStatusCache = readTrackingStatusCache();

      if (!items.length) {
        sentTableWrap.classList.add('hidden');
        sentEmpty.classList.remove('hidden');
        sentEmpty.textContent = '还没有发送记录。';
        return;
      }

      items.forEach(item => {
        const row = document.createElement('tr');
        const sentAtCell = document.createElement('td');
        const recipientLabelCell = document.createElement('td');
        const recipientEmailCell = document.createElement('td');
        const nameCell = document.createElement('td');
        const trackingCell = document.createElement('td');
        const statusCell = document.createElement('td');
        const actionCell = document.createElement('td');
        const queryButton = document.createElement('button');

        sentAtCell.textContent = item.sent_at || '时间未知';
        recipientLabelCell.textContent = item.recipient_label || '未记录';
        recipientEmailCell.textContent = item.recipient_email || '未记录';
        nameCell.textContent = item.email_name || '未命名邮件';
        trackingCell.textContent = item.tracking_id || '未启用跟踪';
        trackingCell.className = 'tracking-code';
        statusCell.textContent = item.tracking_enabled ? '尚未查询' : '未启用跟踪';
        statusCell.className = 'sent-status';
        const cachedStatus = item.tracking_id ? trackingStatusCache[item.tracking_id] : null;
        if (cachedStatus) applyTrackingStatus(cachedStatus, statusCell);

        queryButton.type = 'button';
        queryButton.className = 'secondary-button';
        queryButton.textContent = cachedStatus ? '重新查询' : '查询';
        queryButton.disabled = !item.tracking_enabled;
        queryButton.addEventListener('click', () => {
          querySentTracking(item, statusCell, queryButton);
        });

        actionCell.appendChild(queryButton);
        row.append(
          sentAtCell,
          recipientLabelCell,
          recipientEmailCell,
          nameCell,
          trackingCell,
          statusCell,
          actionCell
        );
        sentTableBody.appendChild(row);
      });

      sentEmpty.classList.add('hidden');
      sentTableWrap.classList.remove('hidden');
    }

    async function loadSentEmails() {
      refreshSentButton.disabled = true;
      refreshSentButton.textContent = '读取中…';
      sentTableWrap.classList.add('hidden');
      sentEmpty.classList.remove('hidden');
      sentEmpty.textContent = '正在读取已发送邮件…';

      try {
        const response = await fetch('/api/email/sent', {
          headers: { Authorization: sessionPassword }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || '读取已发送列表失败。');
        }
        renderSentEmails(data.items || []);
      } catch (error) {
        sentEmpty.textContent = error.message;
      } finally {
        refreshSentButton.disabled = false;
        refreshSentButton.textContent = '刷新列表';
      }
    }

    async function clearSentEmails() {
      const confirmed = window.confirm(
        '确定清空全部发送和跟踪记录吗？此操作不可恢复，但不会撤回已经发出的邮件。'
      );
      if (!confirmed) return;

      clearSentButton.disabled = true;
      clearSentButton.textContent = '清空中…';
      try {
        const response = await fetch('/api/email/sent', {
          method: 'DELETE',
          headers: { Authorization: sessionPassword }
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.message || '清空发送记录失败。');
        }
        localStorage.removeItem(trackingStatusCacheKey);
        renderSentEmails([]);
        sentEmpty.textContent = `已清空 ${data.deleted_count || 0} 条邮件记录。`;
      } catch (error) {
        sentEmpty.classList.remove('hidden');
        sentEmpty.textContent = error.message;
      } finally {
        clearSentButton.disabled = false;
        clearSentButton.textContent = '清空记录';
      }
    }

    function showSentView() {
      emailForm.classList.add('hidden');
      sentView.classList.remove('hidden');
      composeNav.classList.remove('active');
      sentNav.classList.add('active');
      loadSentEmails();
    }

    async function checkStatus(password) {
      const response = await fetch('/api/email/status', {
        headers: { Authorization: password }
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || '管理密码错误。');
      }

      sessionPassword = password;
      sessionStorage.setItem('emailAdminPassword', password);
      smtpConfigured = Boolean(data.smtp_configured);
      authOverlay.classList.add('hidden');
      accountLabel.textContent = data.sender
        ? `${data.sender_name || '颜桥'}（${data.sender}）`
        : 'SMTP 尚未配置';

      if (smtpConfigured) {
        setConnection('ready', `${data.sender} 已连接`);
        hideMessage();
      } else {
        setConnection('warning', 'SMTP 授权码尚未配置');
        showMessage('页面已经可用，但发送前还需在 Render 环境变量中配置 SMTP_USER 和 SMTP_AUTH_CODE。', 'warning');
      }
    }

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      authError.textContent = '';
      const password = adminPassword.value;

      try {
        await checkStatus(password);
        adminPassword.value = '';
      } catch (error) {
        authError.textContent = error.message;
      }
    });

    emailForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();

      if (!smtpConfigured) {
        showMessage('SMTP 尚未配置，暂时不能发送。请先添加 163 邮箱授权码。', 'warning');
        return;
      }

      const formData = new FormData(emailForm);
      formData.set('tracking_enabled', trackingEnabled.checked ? 'true' : 'false');
      sendButton.disabled = true;
      sendButton.textContent = '发送中…';

      try {
        const response = await fetch('/api/email/send', {
          method: 'POST',
          headers: { Authorization: sessionPassword },
          body: formData
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || '邮件发送失败。');
        }

        const trackingText = data.tracking_enabled
          ? `\n跟踪编号：${data.tracking_id}`
          : '\n本封邮件未启用打开跟踪。';
        const historyText = data.history_saved === false
          ? '\n发送记录暂存于服务器，后台会继续补存。'
          : '\n发送记录已保存到历史列表。';
        showMessage(`邮件已成功交给 163 SMTP 发送。${trackingText}${historyText}`, 'success');
        emailForm.reset();
        trackingEnabled.checked = true;
        renderFiles();
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = '发送';
      }
    });

    clearButton.addEventListener('click', () => {
      emailForm.reset();
      trackingEnabled.checked = true;
      renderFiles();
      hideMessage();
    });

    logoutButton.addEventListener('click', () => {
      sessionStorage.removeItem('emailAdminPassword');
      sessionPassword = '';
      authOverlay.classList.remove('hidden');
      adminPassword.focus();
    });

    attachments.addEventListener('change', renderFiles);
    composeButton.addEventListener('click', showComposeView);
    composeNav.addEventListener('click', showComposeView);
    sentNav.addEventListener('click', showSentView);
    sentToolbarButton.addEventListener('click', showSentView);
    backComposeButton.addEventListener('click', showComposeView);
    refreshSentButton.addEventListener('click', loadSentEmails);
    clearSentButton.addEventListener('click', clearSentEmails);

    if (sessionPassword) {
      checkStatus(sessionPassword).catch(() => {
        sessionStorage.removeItem('emailAdminPassword');
        sessionPassword = '';
        authOverlay.classList.remove('hidden');
      });
    } else {
      adminPassword.focus();
    }
  </script>
</body>
</html>
