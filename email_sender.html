<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>投稿邮箱</title>
  <style>
    :root {
      --brand: #c5242c;
      --brand-dark: #9f1720;
      --brand-soft: #fff1f2;
      --line: #e6e8eb;
      --muted: #69707a;
      --text: #24272b;
      --sidebar: #f7f8fa;
      --success: #18794e;
      --warning: #a35b00;
      --danger: #b42318;
      --shadow: 0 16px 48px rgba(35, 38, 45, .16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      background: #eef0f3;
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: 64px 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      color: #fff;
      background: linear-gradient(110deg, var(--brand-dark), var(--brand));
      box-shadow: 0 2px 10px rgba(91, 9, 15, .22);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 9px;
      background: rgba(255, 255, 255, .12);
      font-size: 19px;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: .04em;
    }

    .brand-subtitle {
      margin-top: 1px;
      color: rgba(255, 255, 255, .72);
      font-size: 11px;
    }

    .account {
      display: flex;
      align-items: center;
      gap: 12px;
      color: rgba(255, 255, 255, .88);
    }

    .account button {
      padding: 7px 11px;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, .35);
      border-radius: 6px;
      background: transparent;
    }

    .layout {
      min-height: 0;
      display: grid;
      grid-template-columns: 190px minmax(0, 1fr);
    }

    .sidebar {
      padding: 20px 14px;
      border-right: 1px solid var(--line);
      background: var(--sidebar);
    }

    .compose-nav {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px 14px;
      color: #fff;
      border: 0;
      border-radius: 7px;
      background: var(--brand);
      box-shadow: 0 5px 14px rgba(197, 36, 44, .22);
      font-weight: 700;
    }

    .nav-list {
      display: grid;
      gap: 4px;
      margin-top: 18px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      color: #4c535b;
      border-radius: 6px;
    }

    .nav-item.active {
      color: var(--brand);
      background: var(--brand-soft);
      font-weight: 700;
    }

    .main {
      min-width: 0;
      padding: 24px;
    }

    .composer {
      max-width: 1080px;
      min-height: calc(100vh - 112px);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      box-shadow: 0 8px 28px rgba(35, 38, 45, .07);
    }

    .composer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: #fbfbfc;
    }

    .composer-title {
      font-size: 17px;
      font-weight: 700;
    }

    .connection {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .connection-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #a4a8ae;
    }

    .connection.ready .connection-dot {
      background: #2eaa69;
      box-shadow: 0 0 0 3px rgba(46, 170, 105, .13);
    }

    .connection.warning .connection-dot {
      background: #e49a23;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px;
      border-bottom: 1px solid var(--line);
    }

    .send-button {
      min-width: 88px;
      padding: 9px 18px;
      color: #fff;
      border: 0;
      border-radius: 6px;
      background: var(--brand);
      font-weight: 700;
    }

    .send-button:hover {
      background: var(--brand-dark);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .secondary-button {
      padding: 8px 14px;
      color: #4b5158;
      border: 1px solid #d4d7db;
      border-radius: 6px;
      background: #fff;
    }

    .form-row {
      display: grid;
      grid-template-columns: 84px minmax(0, 1fr);
      align-items: center;
      min-height: 50px;
      padding: 0 20px;
      border-bottom: 1px solid var(--line);
    }

    .form-row label {
      color: #555c64;
    }

    .form-row input {
      min-width: 0;
      padding: 11px 4px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
    }

    .form-row input::placeholder,
    textarea::placeholder {
      color: #a0a5ab;
    }

    .attachment-row {
      align-items: start;
      padding-top: 10px;
      padding-bottom: 10px;
    }

    .attachment-control {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px;
    }

    .attachment-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      color: #4b5158;
      border: 1px solid #d4d7db;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }

    .attachment-label input {
      display: none;
    }

    .attachment-hint {
      color: var(--muted);
      font-size: 12px;
    }

    .file-list {
      width: 100%;
      display: grid;
      gap: 5px;
      margin-top: 5px;
      color: #555c64;
      font-size: 12px;
    }

    .body-wrap {
      padding: 18px 20px 0;
    }

    .body-label {
      margin-bottom: 9px;
      color: #555c64;
    }

    textarea {
      width: 100%;
      min-height: 320px;
      resize: vertical;
      padding: 15px;
      border: 1px solid #dfe2e6;
      border-radius: 7px;
      outline: none;
      color: #202328;
      background: #fff;
      line-height: 1.75;
    }

    textarea:focus,
    .form-row:focus-within {
      border-color: #d7a1a4;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .options {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 20px 20px;
    }

    .tracking-option {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #41474e;
    }

    .tracking-option input {
      width: 17px;
      height: 17px;
      accent-color: var(--brand);
    }

    .tracking-help {
      color: var(--muted);
      font-size: 12px;
    }

    .message {
      display: none;
      margin: 0 20px 18px;
      padding: 11px 13px;
      border-radius: 6px;
      white-space: pre-wrap;
    }

    .message.show {
      display: block;
    }

    .message.success {
      color: var(--success);
      background: #ebf8f1;
    }

    .message.warning {
      color: var(--warning);
      background: #fff6e5;
    }

    .message.error {
      color: var(--danger);
      background: #fff0ef;
    }

    .tracking-panel {
      margin: 0 20px 20px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfbfc;
    }

    .tracking-panel-title {
      margin-bottom: 10px;
      font-weight: 700;
    }

    .tracking-controls {
      display: flex;
      gap: 8px;
    }

    .tracking-controls input {
      min-width: 0;
      flex: 1;
      padding: 9px 11px;
      border: 1px solid #d7dade;
      border-radius: 6px;
      outline: none;
    }

    .tracking-result {
      margin-top: 11px;
      padding: 10px 12px;
      color: var(--muted);
      border-radius: 6px;
      background: #f0f1f3;
    }

    .tracking-result.opened {
      color: var(--success);
      background: #e8f7ef;
    }

    .tracking-result.pending {
      color: var(--warning);
      background: #fff6e5;
    }

    .tracking-disclaimer {
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(28, 31, 37, .62);
      backdrop-filter: blur(4px);
    }

    .auth-overlay.hidden {
      display: none;
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 28px;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--shadow);
    }

    .auth-icon {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
      color: #fff;
      border-radius: 10px;
      background: var(--brand);
      font-size: 21px;
    }

    .auth-card h1 {
      margin: 0;
      font-size: 21px;
    }

    .auth-card p {
      margin: 8px 0 18px;
      color: var(--muted);
    }

    .auth-card input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d7dade;
      border-radius: 7px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(197, 36, 44, .1);
    }

    .auth-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 14px;
    }

    .auth-error {
      min-height: 20px;
      margin-top: 9px;
      color: var(--danger);
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        display: none;
      }

      .main {
        padding: 12px;
      }

      .composer {
        min-height: calc(100vh - 88px);
      }

      .account span {
        display: none;
      }

      .form-row {
        grid-template-columns: 72px minmax(0, 1fr);
        padding: 0 14px;
      }

      .body-wrap,
      .toolbar,
      .options {
        padding-right: 14px;
        padding-left: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">✉</div>
        <div>
          <div class="brand-title">投稿邮箱</div>
          <div class="brand-subtitle">普通正文 · 附件 · 打开跟踪</div>
        </div>
      </div>
      <div class="account">
        <span id="accountLabel">尚未连接 SMTP</span>
        <button id="logoutButton" type="button">退出</button>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <button class="compose-nav" type="button">✎ 写信</button>
        <nav class="nav-list" aria-label="邮箱导航">
          <div class="nav-item active">▣ 正在写信</div>
          <div class="nav-item">□ 已发送</div>
          <div class="nav-item">◉ 跟踪记录</div>
        </nav>
      </aside>

      <main class="main">
        <form id="emailForm" class="composer">
          <div class="composer-header">
            <div class="composer-title">写投稿邮件</div>
            <div id="connectionStatus" class="connection">
              <span class="connection-dot"></span>
              <span id="connectionText">正在检查发信配置</span>
            </div>
          </div>

          <div class="toolbar">
            <button id="sendButton" class="send-button" type="submit">发送</button>
            <button id="clearButton" class="secondary-button" type="button">清空</button>
          </div>

          <div class="form-row">
            <label for="recipient">收件人</label>
            <input id="recipient" name="recipient" type="email" required placeholder="name@example.com" autocomplete="off">
          </div>

          <div class="form-row">
            <label for="subject">主题</label>
            <input id="subject" name="subject" type="text" maxlength="200" required placeholder="请输入邮件主题">
          </div>

          <div class="form-row">
            <label for="submissionName">投稿名称</label>
            <input id="submissionName" name="submission_name" type="text" maxlength="100" placeholder="用于你自己在跟踪记录中辨认">
          </div>

          <div class="form-row">
            <label for="senderName">发件人名称</label>
            <input id="senderName" name="sender_name" type="text" maxlength="60" value="投稿邮箱">
          </div>

          <div class="form-row attachment-row">
            <label>附件</label>
            <div class="attachment-control">
              <label class="attachment-label">
                <span>＋ 添加附件</span>
                <input id="attachments" name="attachments" type="file" multiple>
              </label>
              <span class="attachment-hint">最多 5 个，合计不超过 20 MB</span>
              <div id="fileList" class="file-list"></div>
            </div>
          </div>

          <div class="body-wrap">
            <div class="body-label">正文</div>
            <textarea id="body" name="body" required placeholder="这里直接粘贴或输入普通 TXT 正文，不需要写 HTML。"></textarea>
          </div>

          <div class="options">
            <label class="tracking-option">
              <input id="trackingEnabled" name="tracking_enabled" type="checkbox" checked>
              <span>启用打开跟踪</span>
            </label>
            <span class="tracking-help">后台会自动在正文末尾加入透明的 1×1 图片。</span>
          </div>

          <div id="message" class="message" role="status"></div>

          <section class="tracking-panel" aria-label="邮件打开状态">
            <div class="tracking-panel-title">打开跟踪</div>
            <div class="tracking-controls">
              <input id="trackingIdInput" type="text" placeholder="发送后会自动填入跟踪编号" autocomplete="off">
              <button id="checkTrackingButton" class="secondary-button" type="button">刷新状态</button>
            </div>
            <div id="trackingResult" class="tracking-result">尚未选择跟踪邮件。</div>
            <div class="tracking-disclaimer">“已打开”只说明邮箱加载过邮件中的图片，可用于确认邮件有效，不代表对方完整阅读。</div>
          </section>
        </form>
      </main>
    </div>
  </div>

  <div id="authOverlay" class="auth-overlay">
    <form id="authForm" class="auth-card">
      <div class="auth-icon">✉</div>
      <h1>进入投稿邮箱</h1>
      <p>输入风水大师后台现有的管理密码。密码只保存在本次浏览器会话中。</p>
      <input id="adminPassword" type="password" required autocomplete="current-password" placeholder="管理密码">
      <div id="authError" class="auth-error"></div>
      <div class="auth-actions">
        <button class="send-button" type="submit">进入写信</button>
      </div>
    </form>
  </div>

  <script>
    const emailForm = document.getElementById('emailForm');
    const authForm = document.getElementById('authForm');
    const authOverlay = document.getElementById('authOverlay');
    const authError = document.getElementById('authError');
    const adminPassword = document.getElementById('adminPassword');
    const connectionStatus = document.getElementById('connectionStatus');
    const connectionText = document.getElementById('connectionText');
    const accountLabel = document.getElementById('accountLabel');
    const sendButton = document.getElementById('sendButton');
    const clearButton = document.getElementById('clearButton');
    const logoutButton = document.getElementById('logoutButton');
    const attachments = document.getElementById('attachments');
    const fileList = document.getElementById('fileList');
    const message = document.getElementById('message');
    const trackingEnabled = document.getElementById('trackingEnabled');
    const trackingIdInput = document.getElementById('trackingIdInput');
    const checkTrackingButton = document.getElementById('checkTrackingButton');
    const trackingResult = document.getElementById('trackingResult');

    let sessionPassword = sessionStorage.getItem('emailAdminPassword') || '';
    let smtpConfigured = false;
    const trackingCheckInterval = 8 * 60 * 60 * 1000;

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    function hideMessage() {
      message.textContent = '';
      message.className = 'message';
    }

    function setConnection(state, text) {
      connectionStatus.className = `connection ${state || ''}`;
      connectionText.textContent = text;
    }

    function formatBytes(bytes) {
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    }

    function renderFiles() {
      fileList.replaceChildren();
      Array.from(attachments.files).forEach(file => {
        const row = document.createElement('div');
        row.textContent = `${file.name} · ${formatBytes(file.size)}`;
        fileList.appendChild(row);
      });
    }

    function setTrackingResult(text, state) {
      trackingResult.textContent = text;
      trackingResult.className = `tracking-result ${state || ''}`.trim();
    }

    async function checkTracking() {
      const trackingId = trackingIdInput.value.trim();
      if (!trackingId) {
        setTrackingResult('请先输入跟踪编号。', 'pending');
        return;
      }

      checkTrackingButton.disabled = true;
      checkTrackingButton.textContent = '查询中…';

      try {
        const response = await fetch(`/api/email/tracking/${encodeURIComponent(trackingId)}`, {
          headers: { Authorization: sessionPassword }
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || '跟踪状态查询失败。');
        }

        localStorage.setItem('lastEmailTrackingId', trackingId);
        localStorage.setItem('lastEmailTrackingCheckAt', String(Date.now()));

        if (data.opened) {
          const timeText = data.last_opened_at ? `；最近打开：${data.last_opened_at}` : '';
          setTrackingResult(`已打开 · 邮件有效${timeText}`, 'opened');
        } else {
          setTrackingResult('暂未检测到打开。邮件可能尚未打开，或对方邮箱拦截了外部图片。', 'pending');
        }
      } catch (error) {
        setTrackingResult(error.message, 'pending');
      } finally {
        checkTrackingButton.disabled = false;
        checkTrackingButton.textContent = '刷新状态';
      }
    }

    function restoreTrackingStatus() {
      const trackingId = localStorage.getItem('lastEmailTrackingId') || '';
      if (!trackingId) return;

      trackingIdInput.value = trackingId;
      const lastCheckedAt = Number(localStorage.getItem('lastEmailTrackingCheckAt') || 0);
      if (Date.now() - lastCheckedAt >= trackingCheckInterval) {
        checkTracking();
      } else {
        setTrackingResult('已载入上次跟踪邮件。点击“刷新状态”可立即查询。');
      }
    }

    async function checkStatus(password) {
      const response = await fetch('/api/email/status', {
        headers: { Authorization: password }
      });
      const data = await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(data.message || '管理密码错误。');
      }

      sessionPassword = password;
      sessionStorage.setItem('emailAdminPassword', password);
      smtpConfigured = Boolean(data.smtp_configured);
      authOverlay.classList.add('hidden');
      accountLabel.textContent = data.sender || 'SMTP 尚未配置';

      if (smtpConfigured) {
        setConnection('ready', `${data.sender} 已连接`);
        hideMessage();
        restoreTrackingStatus();
      } else {
        setConnection('warning', 'SMTP 授权码尚未配置');
        showMessage('页面已经可用，但发送前还需在 Render 环境变量中配置 SMTP_USER 和 SMTP_AUTH_CODE。', 'warning');
      }
    }

    authForm.addEventListener('submit', async event => {
      event.preventDefault();
      authError.textContent = '';
      const password = adminPassword.value;

      try {
        await checkStatus(password);
        adminPassword.value = '';
      } catch (error) {
        authError.textContent = error.message;
      }
    });

    emailForm.addEventListener('submit', async event => {
      event.preventDefault();
      hideMessage();

      if (!smtpConfigured) {
        showMessage('SMTP 尚未配置，暂时不能发送。请先添加 163 邮箱授权码。', 'warning');
        return;
      }

      const formData = new FormData(emailForm);
      formData.set('tracking_enabled', trackingEnabled.checked ? 'true' : 'false');
      sendButton.disabled = true;
      sendButton.textContent = '发送中…';

      try {
        const response = await fetch('/api/email/send', {
          method: 'POST',
          headers: { Authorization: sessionPassword },
          body: formData
        });
        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          throw new Error(data.message || '邮件发送失败。');
        }

        const trackingText = data.tracking_enabled
          ? `\n跟踪编号：${data.tracking_id}`
          : '\n本封邮件未启用打开跟踪。';
        showMessage(`邮件已成功交给 163 SMTP 发送。${trackingText}`, 'success');
        emailForm.reset();
        document.getElementById('senderName').value = '投稿邮箱';
        trackingEnabled.checked = true;
        renderFiles();
        if (data.tracking_enabled) {
          trackingIdInput.value = data.tracking_id;
          localStorage.setItem('lastEmailTrackingId', data.tracking_id);
          localStorage.removeItem('lastEmailTrackingCheckAt');
          setTrackingResult('等待对方邮箱加载跟踪图片。稍后可刷新状态。', 'pending');
        }
      } catch (error) {
        showMessage(error.message, 'error');
      } finally {
        sendButton.disabled = false;
        sendButton.textContent = '发送';
      }
    });

    clearButton.addEventListener('click', () => {
      emailForm.reset();
      document.getElementById('senderName').value = '投稿邮箱';
      trackingEnabled.checked = true;
      renderFiles();
      trackingIdInput.value = localStorage.getItem('lastEmailTrackingId') || '';
      hideMessage();
    });

    logoutButton.addEventListener('click', () => {
      sessionStorage.removeItem('emailAdminPassword');
      sessionPassword = '';
      authOverlay.classList.remove('hidden');
      adminPassword.focus();
    });

    attachments.addEventListener('change', renderFiles);
    checkTrackingButton.addEventListener('click', checkTracking);

    if (sessionPassword) {
      checkStatus(sessionPassword).catch(() => {
        sessionStorage.removeItem('emailAdminPassword');
        sessionPassword = '';
        authOverlay.classList.remove('hidden');
      });
    } else {
      adminPassword.focus();
    }
  </script>
</body>
</html>
