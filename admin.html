<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>风水大师 · 管理后台</title>
  <style>
    body {
      font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #1a0a0a;
      color: #e8d5c0;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: rgba(37, 18, 18, 0.9);
      border: 1px solid #c9a86c;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    h2, h3 {
      color: #f0d6a8;
      text-align: center;
      letter-spacing: 2px;
    }
    h2 {
      margin-top: 0;
      border-bottom: 1px solid rgba(201, 168, 108, 0.3);
      padding-bottom: 15px;
    }
    .form-group {
      margin-bottom: 20px;
      text-align: center;
    }
    input[type="password"] {
      padding: 10px 15px;
      width: 260px;
      border: 1px solid #c9a86c;
      border-radius: 8px;
      background: #1a0a0a;
      color: #e8d5c0;
      outline: none;
      font-size: 14px;
      text-align: center;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #c9a86c;
      color: #1a0a0a;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s;
    }
    button:hover {
      background: #f0d6a8;
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }
    th, td {
      border: 1px solid rgba(201, 168, 108, 0.2);
      padding: 12px;
      text-align: left;
    }
    th {
      background: rgba(201, 168, 108, 0.1);
      color: #f0d6a8;
    }
    tr:nth-child(even) {
      background: rgba(255,255,255,0.02);
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
    }
    .badge-pending {
      background: #ffd200;
      color: #000;
    }
    .badge-approved {
      background: #5a9a6a;
      color: #fff;
    }
    .badge-rejected {
      background: #b05850;
      color: #fff;
    }
    .btn-approve {
      background: #5a9a6a;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
      margin-right: 5px;
    }
    .btn-reject {
      background: #b05850;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
      margin-right: 5px;
    }
    .btn-delete {
      background: #666;
      color: white;
      padding: 6px 12px;
      font-size: 12px;
    }
    .section {
      margin-top: 40px;
      border-top: 1px solid rgba(201, 168, 108, 0.2);
      padding-top: 20px;
    }
    .no-data {
      text-align: center;
      color: #806040;
      font-style: italic;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>☯ 风水大师管理后台</h2>
    
    <div class="form-group" id="loginArea">
      <input type="password" id="adminPassword" placeholder="请输入管理员验证密码" value="">
      <button onclick="loadClaims()">进入管理后台</button>
    </div>

    <div id="adminPanel" style="display: none;">
      <!-- System Configuration Card -->
      <div style="background: rgba(201, 168, 108, 0.05); border: 1px solid rgba(201, 168, 108, 0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
        <span style="font-weight: bold; color: #f0d6a8; font-size: 14px;">🤖 API 接口通道切换：</span>
        <div style="display: flex; gap: 20px; align-items: center;">
          <label style="cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="api_provider" value="gemini" onchange="changeApiProvider(this.value)"> 谷歌原生 API (9密钥轮询/自愈)
          </label>
          <label style="cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px;">
            <input type="radio" name="api_provider" value="openrouter" onchange="changeApiProvider(this.value)"> OpenRouter API (备用通道)
          </label>
        </div>
      </div>

      <!-- Statistics Card -->
      <div style="background: rgba(201, 168, 108, 0.05); border: 1px solid rgba(201, 168, 108, 0.3); padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 30px; justify-content: space-around; flex-wrap: wrap;">
        <div style="text-align: center;">
          <div style="font-size: 12px; color: #a08060; margin-bottom: 4px;">📅 统计日期</div>
          <div style="font-size: 18px; font-weight: bold; color: #f0d6a8;" id="statsDate">--</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 12px; color: #a08060; margin-bottom: 4px;">📈 今日总测算次数</div>
          <div style="font-size: 22px; font-weight: bold; color: #ffd200;" id="statsTotalRequests">0</div>
        </div>
        <div style="text-align: center;">
          <div style="font-size: 12px; color: #a08060; margin-bottom: 4px;">📱 今日活跃设备数</div>
          <div style="font-size: 22px; font-weight: bold; color: #5a9a6a;" id="statsActiveDevices">0</div>
        </div>
      </div>

      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; text-align: left;">📋 待审核与打赏记录</h3>
        <button onclick="loadClaims()" style="background: transparent; border: 1px solid #c9a86c; color: #c9a86c; padding: 6px 14px; font-size: 12px;">🔄 刷新列表</button>
      </div>

      <table id="pendingTable">
        <thead>
          <tr>
            <th>提交时间</th>
            <th>设备UUID</th>
            <th>申请类型</th>
            <th>打赏微信昵称 / 单号后4位</th>
            <th>审核状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="pendingBody">
          <!-- Pending items -->
        </tbody>
      </table>

      <div class="section">
        <h3 style="text-align: left; margin-bottom: 15px;">✅ 已激活设备列表</h3>
        <table id="unlockTable">
          <thead>
            <tr>
              <th>激活时间</th>
              <th>设备UUID</th>
              <th>激活次数</th>
              <th>兑换码</th>
              <th>打赏核对信息</th>
            </tr>
          </thead>
          <tbody id="unlockBody">
            <!-- Unlocked items -->
          </tbody>
        </table>
      </div>

      <!-- Guest and Unregistered Visitors Table Section -->
      <div class="section">
        <h3 style="text-align: left; margin-bottom: 15px;">👤 今日访客与未激活设备 (限制 6 次/天)</h3>
        <table id="visitorsTable">
          <thead>
            <tr>
              <th>设备 UUID / IP</th>
              <th>今日已使用次数</th>
              <th>类型</th>
            </tr>
          </thead>
          <tbody id="visitorsBody">
            <!-- Guest items -->
          </tbody>
        </table>
      </div>

    </div>
  </div>

  <script>
    let currentPassword = '';

    function getSavedPassword() {
      return localStorage.getItem('admin_password') || '';
    }

    document.getElementById('adminPassword').value = getSavedPassword();

    async function loadClaims() {
      const password = document.getElementById('adminPassword').value.trim();
      if (!password) {
        alert('请输入管理员验证密码。');
        return;
      }
      
      try {
        const response = await fetch('/api/admin/claims', {
          headers: {
            'Authorization': password
          }
        });
        
        if (!response.ok) {
          const data = await response.json();
          alert(data.message || '密码错误。');
          return;
        }
        
        // Save password if correct
        localStorage.setItem('admin_password', password);
        currentPassword = password;
        
        const data = await response.json();
        
        // Render statistics & visitors
        renderStats(data.today_usage || {}, data.unlocks || {}, data.date_key || '--');
        
        renderPending(data.pending_claims);
        renderUnlocks(data.unlocks, data.today_usage || {});
        renderVisitors(data.today_usage || {}, data.unlocks || {});
        
        // Set the active provider radio button
        const provider = data.api_provider || 'gemini';
        const radio = document.querySelector(`input[name="api_provider"][value="${provider}"]`);
        if (radio) radio.checked = true;
        
        document.getElementById('loginArea').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
      } catch (e) {
        alert('无法连接服务器，请稍后重试。');
      }
    }

    function renderPending(pendingClaims) {
      const tbody = document.getElementById('pendingBody');
      tbody.innerHTML = '';
      
      const uuids = Object.keys(pendingClaims || {}).sort((a,b) => {
        return new Date(pendingClaims[b].submittedAt) - new Date(pendingClaims[a].submittedAt);
      });
      
      if (uuids.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="no-data">暂无待审核记录</td></tr>`;
        return;
      }
      
      uuids.forEach(uuid => {
        const claim = pendingClaims[uuid];
        const date = new Date(claim.submittedAt).toLocaleString('zh-CN');
        const statusBadge = claim.status === 'pending' 
          ? `<span class="badge badge-pending">待审核</span>` 
          : (claim.status === 'approved' 
            ? `<span class="badge badge-approved">已同意</span>` 
            : `<span class="badge badge-rejected">已拒绝</span>`);
        
        let actions = '';
        if (claim.status === 'pending') {
          actions = `
            <button class="btn-approve" onclick="handleAction('${uuid}', 'approve')">同意</button>
            <button class="btn-reject" onclick="handleAction('${uuid}', 'reject')">拒绝</button>
          `;
        } else {
          actions = `
            <button class="btn-delete" onclick="handleAction('${uuid}', 'delete')">删除记录</button>
          `;
        }
        
        tbody.innerHTML += `
          <tr>
            <td style="font-size:12px;">${date}</td>
            <td style="font-family: monospace; font-size: 11px;">${uuid.substring(0, 8)}...</td>
            <td>${claim.tier}次/天</td>
            <td style="font-weight: bold; color: #f0d6a8;">${claim.payment_info}</td>
            <td>${statusBadge}</td>
            <td>${actions}</td>
          </tr>
        `;
      });
    }

    function renderStats(todayUsage, unlocks, dateKey) {
      document.getElementById('statsDate').textContent = dateKey;
      
      let totalRequests = 0;
      let activeDevices = 0;
      
      const keys = Object.keys(todayUsage);
      const uuidKeys = keys.filter(k => !k.includes('.') && !k.includes(':'));
      const ipKeys = keys.filter(k => k.includes('.') || k.includes(':'));
      
      uuidKeys.forEach(k => {
        totalRequests += todayUsage[k] || 0;
        if (todayUsage[k] > 0) activeDevices++;
      });
      
      if (uuidKeys.length === 0) {
        ipKeys.forEach(k => {
          totalRequests += todayUsage[k] || 0;
          if (todayUsage[k] > 0) activeDevices++;
        });
      }
      
      document.getElementById('statsTotalRequests').textContent = totalRequests;
      document.getElementById('statsActiveDevices').textContent = activeDevices;
    }

    function renderUnlocks(unlocks, todayUsage) {
      const tbody = document.getElementById('unlockBody');
      tbody.innerHTML = '';
      
      const uuids = Object.keys(unlocks || {}).sort((a,b) => {
        return new Date(unlocks[b].activatedAt) - new Date(unlocks[a].activatedAt);
      });
      
      if (uuids.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="no-data">暂无已激活设备</td></tr>`;
        return;
      }
      
      uuids.forEach(uuid => {
        const unlock = unlocks[uuid];
        const date = new Date(unlock.activatedAt).toLocaleString('zh-CN');
        const usedCount = todayUsage[uuid] || 0;
        
        tbody.innerHTML += `
          <tr>
            <td style="font-size:12px;">${date}</td>
            <td style="font-family: monospace; font-size: 11px;">${uuid}</td>
            <td><strong>${unlock.limit}</strong> 次/天 (今日已用: <strong style="color: #ffd200;">${usedCount}</strong> 次)</td>
            <td style="font-family: monospace; font-size: 11px;">${unlock.code || '--'}</td>
            <td>${unlock.payment_info || '手动后台激活'}</td>
          </tr>
        `;
      });
    }

    function renderVisitors(todayUsage, unlocks) {
      const tbody = document.getElementById('visitorsBody');
      tbody.innerHTML = '';
      
      const guestKeys = Object.keys(todayUsage || {}).filter(key => {
        return !unlocks || !unlocks[key];
      }).sort((a,b) => todayUsage[b] - todayUsage[a]);
      
      if (guestKeys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="3" class="no-data">今日暂无访客记录</td></tr>`;
        return;
      }
      
      guestKeys.forEach(key => {
        const count = todayUsage[key];
        const isIp = key.includes('.') || key.includes(':');
        const typeLabel = isIp ? '💻 仅IP访问' : '📱 网页端设备';
        
        tbody.innerHTML += `
          <tr>
            <td style="font-family: monospace; font-size: 12px; color: #e8d5c0;">${key}</td>
            <td style="font-weight: bold; color: #ffd200;">${count} / 6 次</td>
            <td style="color: #a08060; font-size: 12px;">${typeLabel}</td>
          </tr>
        `;
      });
    }

    async function handleAction(uuid, action) {
      const actionNames = { approve: '同意', reject: '拒绝', delete: '删除' };
      if (!confirm(`确认要${actionNames[action]}该设备 (${uuid.substring(0, 8)}...) 的申请吗？`)) {
        return;
      }
      
      try {
        const response = await fetch('/api/admin/action', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            client_uuid: uuid,
            action: action,
            password: currentPassword
          })
        });
        
        const data = await response.json();
        if (!response.ok || data.error) {
          alert(data.message || data.error || '操作失败');
          return;
        }
        
        loadClaims();
      } catch (e) {
        alert('提交操作出错，请稍后重试。');
      }
    }

    async function changeApiProvider(provider) {
      if (!currentPassword) return;
      try {
        const response = await fetch('/api/admin/config', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            password: currentPassword,
            api_provider: provider
          })
        });
        
        const data = await response.json();
        if (!response.ok || data.error) {
          alert(data.message || data.error || '切换失败');
          return;
        }
        
        console.log(`API provider updated to ${provider}`);
      } catch (e) {
        alert('修改 API 配置出错，请稍后重试。');
      }
    }
  </script>
</body>
</html>
